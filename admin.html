<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | CampusConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html"><span>✦</span> CampusConnect</a><nav><a href="events.html">Events</a><a class="active" href="admin.html">Manage</a><a href="index.html" onclick="logout()">Logout</a></nav></header>
<main class="container">
  <div class="page-head compact"><p class="eyebrow">MANAGEMENT</p><h1>Event control center.</h1><p>Create and manage campus events from one place.</p></div>
  <section class="admin-layout">
    <div class="panel">
      <h2>Create event</h2>
      <form id="eventForm">
        <label>Title<input id="title" required></label>
        <label>Description<textarea id="description" required></textarea></label>
        <div class="two-col"><label>Category<select id="eventCategory"><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option><option>Seminar</option><option>Other</option></select></label><label>Capacity<input id="capacity" type="number" min="1" required></label></div>
        <div class="two-col"><label>Date<input id="date" type="date" required></label><label>Venue<input id="venue" required></label></div>
        <div class="two-col"><label>Start time<input id="startTime" type="time" required></label><label>End time<input id="endTime" type="time" required></label></div>
        <button class="btn" type="submit">Create event</button><p id="message" class="form-message"></p>
      </form>
    </div>
    <div class="panel"><h2>Your events</h2><div id="adminEvents"></div></div>
  </section>
</main>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/dashboard.js"></script>
<script>document.addEventListener("DOMContentLoaded", loadAdmin); document.getElementById("eventForm").addEventListener("submit", createEvent);</script>
</body></html>

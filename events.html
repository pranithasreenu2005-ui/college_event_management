<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | CampusConnect</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="nav"><a class="brand" href="index.html"><span>✦</span> CampusConnect</a><nav><a class="active" href="events.html">Events</a><a href="dashboard.html">Dashboard</a><a href="login.html" onclick="logout()">Logout</a></nav></header>
<main class="container">
  <section class="page-head"><p class="eyebrow">EXPLORE</p><h1>Find your next event.</h1><p>Browse everything happening around campus.</p></section>
  <div class="filters">
    <input id="search" placeholder="Search events...">
    <select id="category"><option>All</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option><option>Seminar</option><option>Other</option></select>
  </div>
  <div id="eventsGrid" class="cards"></div>
</main>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/events.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => { loadEvents("eventsGrid"); search.addEventListener("input", debounce(loadEvents, 300)); category.addEventListener("change", loadEvents); });</script>
</body></html>
